    <title>Rectangle</title>

<body>
    

    <script type="text/javascript">
        let lg = parseFloat(prompt("donner la longueur: "));

        let lr = parseFloat(prompt("donner une largeur: "));

        let s = lg * lr;
        let p = 2*(lg + lr);
        alert("La surface est de: " + s + " Le périmètre est de : " + p);
    </script>
